[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notavis-mipi-trigger"
version = "0.1.1"
description = "External GPIO/PWM trigger for VC MIPI cameras on Raspberry Pi CM5, with Streamlit and PySide6 desktop UIs."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary — NOTAVIS GmbH internal" }
authors = [
  { name = "NOTAVIS GmbH", email = "patrik.drexel@notavis.com" },
]
keywords = ["notavis", "vision-components", "mipi", "raspberry-pi", "gpio", "trigger", "streamlit", "pyside6", "qt"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "streamlit>=1.36",
  # Streamlit 1.61 with starlette>=0.48 raises 'GZipResponder.__init__()
  # missing 1 required keyword-only argument: thread_minimum_size' inside its
  # gzip middleware, breaking every WebSocket handshake. Pin until Streamlit
  # upstream ships a fix. Verified on UniversitySidney1 (CM5, Trixie).
  "starlette>=0.47,<0.48",
  "gpiozero>=2.0",
  "lgpio>=0.2.2.0",
  "pydantic>=2.7",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-mock>=3.14",
  "ruff>=0.6",
]
desktop = [
  "PySide6>=6.7",
]

[project.scripts]
vc-trigger-ui = "vc_trigger.ui:main"
vc-trigger-desktop = "vc_trigger.desktop_ui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vc_trigger"]

[tool.hatch.build.targets.wheel.force-include]
"src/vc_trigger/sensor_profiles" = "vc_trigger/sensor_profiles"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
