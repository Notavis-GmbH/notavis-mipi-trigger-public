[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notavis-mipi-trigger"
version = "0.1.2"
description = "External GPIO/PWM camera trigger for Raspberry Pi CM5, with Streamlit and PySide6 desktop UIs."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "NOTAVIS GmbH", email = "patrik.drexel@notavis.com" },
]
keywords = ["notavis", "raspberry-pi", "gpio", "pwm", "trigger", "streamlit", "pyside6", "qt", "camera"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "streamlit>=1.36",
  # Streamlit 1.61 with starlette>=0.48 raises 'GZipResponder.__init__()
  # missing 1 required keyword-only argument: thread_minimum_size' inside its
  # gzip middleware, breaking every WebSocket handshake. Pin until Streamlit
  # upstream ships a fix. Verified on Raspberry Pi CM5 (Debian 13 Trixie).
  "starlette>=0.47,<0.48",
  "gpiozero>=2.0",
  "lgpio>=0.2.2.0",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-mock>=3.14",
  "ruff>=0.6",
]
desktop = [
  "PySide6>=6.7",
]

[project.scripts]
vc-trigger-ui = "vc_trigger.ui:main"
vc-trigger-desktop = "vc_trigger.desktop_ui:main"

[project.urls]
Homepage = "https://github.com/Notavis-GmbH/notavis-mipi-trigger-public"
Issues = "https://github.com/Notavis-GmbH/notavis-mipi-trigger-public/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/vc_trigger"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
